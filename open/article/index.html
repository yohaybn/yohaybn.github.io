<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pirate RSS</title>
<style>
:root{--bg:#F8F7FC;--ink:#1d2640;--blue:#357ab0;--yellow:#f6c030;--red:#dd4435}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
main{max-width:36rem;margin:0 auto;padding:1.5rem 1rem 3rem}
header{text-align:center;padding:1rem 0 .5rem}header img{width:200px;height:200px}
h1{font-size:2rem;margin:.2rem 0}h1 span{color:var(--red)}
.tag{font-size:1.15rem;font-weight:700;margin:.3rem 0}.en{color:#4a5472}
.notice{background:#fff;border-radius:1rem;padding:1rem;margin:1.2rem 0;box-shadow:0 1px 4px rgba(29,38,64,.12);border-inline-start:6px solid var(--yellow)}
.notice code{display:block;direction:ltr;unicode-bidi:plaintext;word-break:break-all;background:#eef0f7;border-radius:.5rem;padding:.4rem .6rem;margin:.5rem 0;font-size:.85rem}
a.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:.8rem;padding:.85rem 1rem;margin:.6rem 0}
a.play{background:var(--ink);color:#fff;font-size:1.1rem}a.play small{display:block;font-weight:400;opacity:.8}
a.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.card{display:flex;align-items:center;gap:1rem;background:#fff;border-radius:1rem;padding:.8rem 1rem;margin:.8rem 0;box-shadow:0 1px 4px rgba(29,38,64,.1)}
.card img{width:96px;height:96px;flex:none}.card h2{font-size:1.1rem;margin:0}.card h3{font-size:.9rem;margin:.5rem 0 0;color:var(--blue)}.card p{margin:.2rem 0;font-size:.95rem}
footer{text-align:center;font-size:.85rem;color:#4a5472;margin-top:2rem}
</style></head>
<body><main>
<header><img src="../img/intro_1.png" alt="" width="200" height="200"><h1>Pirate <span>RSS</span></h1>
<p class="tag" id="tag"></p><p id="sub"></p></header>
<a class="btn play" id="play" href="https://play.google.com/store/apps/details?id=com.yoyo.rss"></a>
<div class="notice"><strong id="n"></strong>
<div id="t" hidden><code id="u"></code><a class="btn ghost" id="a" href="#"></a></div>
<p id="miss" hidden></p></div>
<div id="cards"></div>
<footer>Pirate RSS &middot; <a href="https://play.google.com/store/apps/details?id=com.yoyo.rss">Google Play</a></footer>
</main>
<script>
var D={"ui": {"en": {"tag": "Read the web without the web reading you. 🏴‍☠️", "sub": "Your sources, your rules, no algorithm in the captain's chair.", "play": "Get it on Google Play", "n": "If the app is installed, this link opens in it directly. If you landed here, it is not installed or the browser did not hand the link over.", "o": "Open the article on the site", "miss": "The link has no address."}, "he": {"tag": "קוראים את האינטרנט בלי שהאינטרנט יקרא אתכם 🏴‍☠️", "sub": "חדשות, בלוגים ופודקאסטים ממקורות שבחרתם, בלי אלגוריתם שמחליט בשבילכם.", "play": "הורדה מ-Google Play", "n": "אם האפליקציה מותקנת, הקישור הזה נפתח בה ישירות. אם הגעת לכאן, היא לא מותקנת או שהדפדפן לא העביר את הקישור.", "o": "פתיחת הכתבה באתר", "miss": "הקישור חסר כתובת."}, "ar": {"tag": "اقرأ الويب دون أن يقرأك الويب 🏴‍☠️", "sub": "مصادرك وقواعدك، بلا خوارزمية تقرر عنك.", "play": "احصل عليه من Google Play", "n": "إذا كان التطبيق مثبتًا، يُفتح هذا الرابط فيه مباشرة. إذا وصلت إلى هنا فهو غير مثبت أو لم يمرر المتصفح الرابط.", "o": "فتح المقال في الموقع", "miss": "الرابط بلا عنوان."}, "ru": {"tag": "Читайте сеть, пока сеть не читает вас 🏴‍☠️", "sub": "Ваши источники, ваши правила, без алгоритма у руля.", "play": "Скачать в Google Play", "n": "Если приложение установлено, эта ссылка откроется прямо в нём. Если вы попали сюда, оно не установлено или браузер не передал ссылку.", "o": "Открыть статью на сайте", "miss": "В ссылке нет адреса."}}, "cards": {"en": [["All your sources in one feed", "The articles you like from every site, in one place that is easy to read"], ["Your feed", "All articles from the sources you chose, lined up together for easy reading"], ["Discover new sources", "Search for sites and topics you care about and add them to your feed"], ["The same story from several sources", "An optional smart scan groups similar articles Open the stack and pick what to read"], ["Read in your language", "Translate an article into the app language and choose how the translation is done"], ["Listen and keep going", "Read articles aloud and move to the next one automatically You can control playback from the playback notification"], ["Back up with an account", "Connect an account to back up your settings and the articles you saved to the cloud"], ["The feed on your home screen", "Widgets with headlines from all sources or from one source you pick"]], "he": [["כל המקורות בפיד אחד", "הכתבות שאתם אוהבים מכל האתרים במקום אחד שנוח לקרוא בו"], ["הפיד שלכם", "כל הכתבות מהמקורות שבחרתם מסודרות יחד לקריאה נוחה"], ["מגלים מקורות חדשים", "מחפשים אתרים ונושאים שמעניינים אתכם ומוסיפים אותם לפיד"], ["אותו סיפור מכמה מקורות", "סריקה חכמה לבחירתכם מקבצת כתבות דומות פותחים את הערימה ובוחרים מה לקרוא"], ["קוראים בשפה שלכם", "מתרגמים כתבה לשפת האפליקציה ובוחרים איך לבצע את התרגום"], ["מקשיבים וממשיכים", "הקראת כתבות עם מעבר אוטומטי לבאה אפשר לשלוט בניגון גם מהתראת ההשמעה"], ["מתחברים לגיבוי", "מחברים חשבון לגיבוי בענן של ההגדרות והכתבות ששמרתם"], ["הפיד גם במסך הבית", "ווידג׳טים לכותרות מכל המקורות או למקור אחד שבחרתם"]], "ar": [["كل مصادرك في خلاصة واحدة", "المقالات التي تعجبك من كل موقع، في مكان واحد سهل القراءة"], ["خلاصتك", "كل المقالات من المصادر التي اخترتها، مصفوفة معًا لتسهيل القراءة"], ["اكتشف مصادر جديدة", "ابحث عن المواقع والمواضيع التي تهمك وأضفها إلى خلاصتك"], ["القصة نفسها من عدة مصادر", "فحص ذكي اختياري يجمع المقالات المتشابهة افتح المجموعة واختر ما تقرؤه"], ["اقرأ بلغتك", "ترجم المقال إلى لغة التطبيق واختر طريقة الترجمة"], ["استمع وتابع", "اقرأ المقالات بصوت عالٍ وانتقل إلى التالي تلقائيًا يمكنك التحكم في التشغيل من إشعار التشغيل"], ["نسخ احتياطي عبر حساب", "اربط حسابًا لنسخ إعداداتك والمقالات التي حفظتها احتياطيًا في السحابة"], ["الخلاصة على شاشتك الرئيسية", "عناصر واجهة بعناوين من كل المصادر أو من مصدر واحد تختاره"]], "ru": [["Все ваши источники в одной ленте", "Статьи, которые вам нравятся, со всех сайтов - в одном удобном для чтения месте"], ["Ваша лента", "Все статьи из выбранных вами источников собраны вместе для удобного чтения"], ["Находите новые источники", "Ищите сайты и темы, которые вам интересны, и добавляйте их в ленту"], ["Одна новость из нескольких источников", "Необязательное умное сканирование группирует похожие статьи Откройте стопку и выберите, что читать"], ["Читайте на своём языке", "Переведите статью на язык приложения и выберите способ перевода"], ["Слушайте и продолжайте", "Читайте статьи вслух и переходите к следующей автоматически Управлять воспроизведением можно из уведомления"], ["Резервная копия через аккаунт", "Подключите аккаунт, чтобы сохранять в облаке настройки и сохранённые статьи"], ["Лента на главном экране", "Виджеты с заголовками из всех источников или из одного выбранного источника"]]}},RTL={he:1,ar:1},P=new URLSearchParams(location.search);
function pick(){var q=(P.get('lang')||'').toLowerCase().slice(0,2);if(D.ui[q])return q;
var n=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];
for(var i=0;i<n.length;i++){var c=String(n[i]).toLowerCase().slice(0,2);if(c==='iw')c='he';if(D.ui[c])return c;}return 'en';}
var L=pick(),U=D.ui[L],h=document.documentElement;h.lang=L;h.dir=RTL[L]?'rtl':'ltr';
function s(i,v){document.getElementById(i).textContent=v}
s('tag',U.tag);s('sub',U.sub);s('play',U.play);s('n',U.n);s('a',U.o);s('miss',U.miss);
var c=document.getElementById('cards');D.cards[L].forEach(function(x,i){if(!i)return;var e=document.createElement('section');e.className='card';
e.innerHTML='<img src="../img/intro_'+(i+1)+'.png" alt="" width="180" height="180" loading="lazy"><div><h2></h2><p></p></div>';
e.querySelector('h2').textContent=x[0];e.querySelector('p').textContent=x[1];c.appendChild(e);});
var u=P.get('url');
if(u&&/^https?:\/\//i.test(u)){document.getElementById('t').hidden=false;document.getElementById('u').textContent=u;document.getElementById('a').href=u;}
else{document.getElementById('miss').hidden=false;}
</script></body></html>
